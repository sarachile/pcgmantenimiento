# Configuración optimizada para evitar errores 400 por falta de cuota o pago
# Se establece minInstances en 0 para que no reserve recursos costosos innecesariamente

runConfig:
  memoryMiB: 1024
  cpu: 1
  minInstances: 0
  maxInstances: 10

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-1862261800-55e9f
