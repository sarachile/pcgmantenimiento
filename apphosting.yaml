# Configuración de recuperación de despliegue optimizada
# Ajustes para evitar saturación de CPU y límites de solicitudes (Rate Exceeded)

runConfig:
  memoryMiB: 1024
  cpu: 1
  minInstances: 0
  maxInstances: 10 # Aumentado ligeramente para manejar picos sin bloqueos

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-1862261800-55e9f
