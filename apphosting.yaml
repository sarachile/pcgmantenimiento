# Configuración optimizada para recuperación de despliegue tras regularización de pago
# Define los recursos mínimos para asegurar que el Rollout no falle por cuotas.

runConfig:
  memoryMiB: 1024
  cpu: 1
  minInstances: 0
  maxInstances: 5

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-1862261800-55e9f
