# Configuración ultra-ligera para asegurar el despliegue tras regularización de pago
# Se minimiza el uso de recursos para evitar errores de cuota (400 Bad Request)

runConfig:
  memoryMiB: 1024
  cpu: 1
  minInstances: 0
  maxInstances: 5

env:
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: studio-1862261800-55e9f
